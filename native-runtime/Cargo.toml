[package]
name = "codex-native-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "codex-official-runtime"
path = "src/main.rs"

# This is a separate runtime built from public Codex libraries, not an
# unmodified official CLI. The build script must verify this vendor revision:
# rust-v0.154.0-alpha.6.2 / b5bffd3ec4db487e7e3dec59663875b0ef7b72ca.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
codex-api = { path = "../.runtime/vendor/codex/codex-rs/codex-api" }
codex-http-client = { path = "../.runtime/vendor/codex/codex-rs/http-client" }
codex-login = { path = "../.runtime/vendor/codex/codex-rs/login" }
codex-model-provider = { path = "../.runtime/vendor/codex/codex-rs/model-provider" }
codex-model-provider-info = { path = "../.runtime/vendor/codex/codex-rs/model-provider-info" }
http = "1"
rand = "0.9"
reqwest = { version = "0.12", features = ["stream", "socks"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

# Dependency patches from the pinned upstream workspace do not propagate into
# a consuming workspace. Keep these exact revisions in sync with that tag.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
